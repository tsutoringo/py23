

{% extends 'base.html' %}
{% block title %}詳細情報{% endblock %}
{% block head %}
  {{ super() }}
{% endblock %}
{% block main %}
<table>
  <tbody>
    {% for (key, label) in fild.items(): %}
      <tr>
        <td>
          {{ label }}
        </td>
        <td>
          {{ values[key] }}
        </td>
      </tr>
    {% endfor %}
    <tr>
      <td>商品画像(小)</td>
      <td><img src="/static/image/{{filename}}" alt=""></td>
      <td></td>
    </tr>
    <tr>
      <td>商品画像(大)</td>
      <td><img src="/static/image/thumb/{{filename}}" alt=""></td>
      <td></td>
    </tr>
  </tbody>
</table>
{% endblock %}
