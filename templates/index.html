<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <table border="1">
    <thead>
      <tr>
        {% for (_, f) in fild.items() %}
          <td>{{ f }}</td>
        {% endfor %}
      </tr>
    </thead>
    <tbody>
      {% for rec in recs %}
        <tr>
          {% for (key, columndata) in rec.items() %}
            {% if key != "fname" %}
              <td>{{ columndata }}</td>
            {% endif %}
          {% endfor %}
          <td>
            <a href="./detail?gno={{ rec['gno'] }}">詳細</a>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
